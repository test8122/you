<!DOCTYPE html>
<html>

<head>

    <title>YouTube Downloader</title>

    <style>

        body{
            background:#111;
            color:white;
            font-family:Arial;
            padding:30px;
        }

        input, select, button{

            padding:10px;
            margin-top:10px;
        }

    </style>

</head>

<body>

<h1>YouTube Downloader</h1>

<form action="/download" method="POST">

    <input
        type="text"
        name="url"
        placeholder="Paste YouTube URL"
        required
        style="width:300px;"
    >

    <br>

    <select name="type">

        <option value="video">
            360p Video With Audio
        </option>

        <option value="audio">
            Best M4A Audio
        </option>

    </select>

    <br>

    <button type="submit">
        Download
    </button>

</form>

</body>
</html>
